name: Publish VoiceShot release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'Kaphleamrit/voiceshot'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - name: Configure the release version and verification key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable version tag such as v1.1.0."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          public_key="$(printf '%s\n' "$SPARKLE_PRIVATE_KEY" | swift scripts/update-public-key.swift)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" Info.plist
          /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string $public_key" Info.plist
      - name: Build release archive
        run: |
          ./build.sh
          codesign --verify --deep --strict VoiceShot.app
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent VoiceShot.app release/VoiceShot-macOS-arm64.zip
      - name: Prepare update summary
        run: |
          notes_path="release/VoiceShot-macOS-arm64.txt"
          git for-each-ref --format='%(if:equals=tag)%(objecttype)%(then)%(contents:body)%(end)' "refs/tags/$RELEASE_TAG" \
            | awk 'NF && ++lines <= 3' > "$notes_path"
          if [ ! -s "$notes_path" ]; then
            previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD^ 2>/dev/null || true)"
            revision_range="${previous_tag:+$previous_tag..}HEAD"
            git log -3 --no-merges --format='• %s' "$revision_range" > "$notes_path"
          fi
      - name: Sign the update archive and appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          sparkle_dir="$(bash scripts/fetch-sparkle.sh)"
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | "$sparkle_dir/bin/generate_appcast" \
            --ed-key-file - --maximum-deltas 0 --embed-release-notes \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
            release
          test -s release/appcast.xml
      - name: Build the drag-to-Applications installer
        run: bash scripts/package-dmg.sh VoiceShot.app release/VoiceShot-macOS-arm64.dmg
      - name: Publish on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release/VoiceShot-macOS-arm64.dmg release/VoiceShot-macOS-arm64.zip release/appcast.xml \
            --verify-tag --generate-notes --latest \
            --notes "Installing for the first time? [Download the Mac installer](https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/VoiceShot-macOS-arm64.dmg), open it, and drag VoiceShot into Applications."
